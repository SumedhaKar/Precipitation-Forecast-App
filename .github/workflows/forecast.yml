# The live forecast: fetch one 00 UTC AIFS ENS run, check it, publish it.
# SPEC 8.8. There is no backfill here: Pile A and Pile B run on the laptop.
#
# The write token is on the two steps that talk to the Blob store and on no
# others. The run_live step cannot see it: ECMWF open data needs no
# credential, and a step that cannot see the token cannot leak it (SPEC 8.9).
name: forecast

# What started this run, in the list of runs. GitHub's own schedule is one
# thing and a dispatch is another, and the dispatches come from three places
# now: the outside scheduler that calls the API every afternoon, a run
# started by hand from the Actions tab, and a test. Without this they are all
# "forecast" and the history cannot be read.
#
# The `source` input is optional and defaults to "manual", so the Run
# workflow button with nothing filled in reads "forecast · manual", and a
# dispatch of {"ref":"main"} with no inputs at all gets the same default from
# GitHub. On a scheduled run there are no inputs, so the event name decides.
run-name: >-
  forecast · ${{ github.event_name == 'schedule' && 'GitHub schedule'
  || inputs.source || 'manual' }}

on:
  # The schedule was held back until someone had watched this job work. The
  # first manual publish and HC7 both passed on 12 November 2026, so it is
  # live from that day.
  schedule:
    # Twelve attempts, 06:17 to 11:47 UTC, which is 11:47 to 17:17 IST.
    # ECMWF documents the 00 UTC deterministic AIFS at 05:45 UTC and our own
    # first live run found 20261112T00Z complete at about 07:06 UTC. Minutes
    # 17 and 47 because scheduled jobs are delayed most at the top of an hour.
    - cron: '17,47 6-11 * * *'
    # Eleven more, 12:23 to 22:23 UTC, hourly. On 12 November 2026 not one of
    # the twelve attempts above ran: the first run of the day appeared at
    # 17:44 UTC, nearly six hours after the window closed. GitHub does not
    # promise to run a scheduled workflow at the time asked for, or at all,
    # so a window that is only five and a half hours wide can be missed
    # whole. The day is now covered to 22:23 UTC, and every attempt after
    # the run is published costs one listing check and exits 0.
    - cron: '23 12-22 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'What started this run (shown in the run title)'
        required: false
        default: 'manual'
        type: string

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Python 3.13.4
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13.4'

      - name: Node 24.22.3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.22.3'

      - name: Install Python requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install the uploader from its lockfile
        working-directory: scripts/publish
        run: npm ci --no-audit --no-fund

      # SPEC 8.6: the Actions disk is empty every run, so the run already
      # published is read from the store and not from data/live/last_run.json.
      # A failed list, or a manifest that cannot be fetched or parsed, exits 1
      # here and stops the job: it is never read as an empty store.
      - name: Read the published run id from the store
        id: store
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          run_id="$(python -m pipeline.publish remote-run-id)"
          echo "published=${run_id}" >> "$GITHUB_OUTPUT"
          if [ -z "${run_id}" ]; then
            echo "the store has nothing published yet"
          else
            echo "the store publishes ${run_id}"
          fi

      # No token on this step, on purpose.
      - name: Build the run
        run: python -m pipeline.run_live --published "${{ steps.store.outputs.published }}"

      - name: Publish
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python -m pipeline.publish

      - name: Keep the logs, whatever happened
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs-${{ github.run_id }}
          path: |
            data/logs/*.log
            data/live/*/manifest.json
            data/live/*/days.json
          if-no-files-found: ignore
          retention-days: 14
