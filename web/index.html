<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- SPEC 11.38: the site's name and what it covers. The two document
         pages set their own titles from the same list, in TopNav.jsx, so a
         reader with three tabs open can tell them apart. -->
    <title>India Rain Outlook · next 5 days</title>
    <meta
      name="description"
      content="One weather model from ECMWF, run 51 times. See how many of the 51 runs bring 1 mm, 10 mm and 50 mm of rain over the next five days, for one place in India. Counts of runs, not probabilities. Not an official warning."
    />
    <!-- SPEC 11.39. The site's own mark, as the tab icon: the same cloud
         and the same three drops as the <Logo> of src/Icons.jsx, written
         out here as a data URI so there is no second file to fetch and
         nothing to 404. A test compares the two paths and fails if they
         drift apart. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7 14.5h9.5a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.5-.8A3.9 3.9 0 0 0 7 14.5Z' fill='%230b2b4a'/%3E%3Cg stroke='%230b2b4a' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M9 17.5v2.2'/%3E%3Cpath d='M12.5 17.5v3.2'/%3E%3Cpath d='M16 17.5v2.2'/%3E%3C/g%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- SPEC 11.22. The map is drawn with JavaScript, but the numbers are
         not behind it: this route answers JSON with no script at all. -->
    <noscript>
      <h1>India Rain Outlook: how many of 51 runs bring rain</h1>
      <p>
        This page draws a map, which needs JavaScript. The forecast itself
        does not: one square's counts, dots and 51 member values are at
        <a href="/api/place?lat=28.5&amp;lon=77.25"
          >/api/place?lat=28.5&amp;lon=77.25</a
        >, and what is published right now is at
        <a href="/api/health">/api/health</a>.
      </p>
      <p>
        These are model-run counts, not a calibrated probability, and not an
        official warning. For warnings see the
        <a href="https://mausam.imd.gov.in/">India Meteorological Department</a>.
      </p>
      <!-- SPEC 11.34. /report-card and /how-we-checked are this same file,
           so a reader with no script lands here from either. The track
           record itself is not behind JavaScript: these are the files the
           two pages read, and the specification every rule is written in. -->
      <h2>The track record</h2>
      <p>
        The report card and How we checked are drawn with JavaScript. The
        numbers behind them are not: they are these files, as published.
      </p>
      <ul>
        <li>
          <a
            href="https://github.com/SumedhaKar/Precipitation-Forecast-App/blob/main/results/site_summary.json"
            >results/site_summary.json</a
          >, the 60 labels with the four conditions behind each
        </li>
        <li>
          <a
            href="https://github.com/SumedhaKar/Precipitation-Forecast-App/blob/main/results/site_details.json"
            >results/site_details.json</a
          >, the decomposition, the sensitivities and the maps
        </li>
        <li>
          <a
            href="https://github.com/SumedhaKar/Precipitation-Forecast-App/blob/main/results/verification.json"
            >results/verification.json</a
          >, every score
        </li>
        <li>
          <a
            href="https://github.com/SumedhaKar/Precipitation-Forecast-App/blob/main/results/labels.json"
            >results/labels.json</a
          >, every label
        </li>
        <li>
          <a
            href="https://github.com/SumedhaKar/Precipitation-Forecast-App/blob/main/results/verification_meta.json"
            >results/verification_meta.json</a
          >, the commit and the hash the rules were fixed in
        </li>
        <li>
          <a
            href="https://github.com/SumedhaKar/Precipitation-Forecast-App/blob/main/SPEC.md"
            >SPEC.md</a
          >, the specification
        </li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
